<svg width="820" height="200" viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <!-- Badge: bg-blue-600 -->
  <circle cx="100" cy="100" r="90" fill="#2563EB"/>

  <g transform="translate(100,102)">
    <!-- open book: darker blue tones -->
    <path d="M0,-8 C-30,-24 -55,-20 -55,-20 L-55,26 C-55,26 -30,20 0,36 Z" fill="#172554"/>
    <path d="M0,-8 C30,-24 55,-20 55,-20 L55,26 C55,26 30,20 0,36 Z" fill="#1E3A8A"/>
    <!-- spine -->
    <rect x="-3" y="-10" width="6" height="46" fill="#0F172A"/>
    <!-- graduation cap above -->
    <g transform="translate(0,-46)">
      <polygon points="0,-14 34,0 0,14 -34,0" fill="#BFDBFE"/>
      <rect x="-3" y="0" width="6" height="14" fill="#BFDBFE"/>
      <circle cx="0" cy="16" r="4" fill="#BFDBFE"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="222" y="128" font-size="72" font-weight="700" letter-spacing="1">
    <tspan fill="#16233F">COURSE</tspan><tspan fill="#2563EB">HUB</tspan>
  </text>

</svg>
