<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">

  <!-- Badge background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#16233F"/>

  <!-- Three-petal hub mark: flat colors, thicker petals, no opacity fades
       so it stays legible down to 16px -->
  <g transform="translate(32,34)">
    <g transform="rotate(0)">
      <path d="M0,0 C-7,-5 -9,-17 0,-23 C9,-17 7,-5 0,0 Z" fill="#00C2A8"/>
    </g>
    <g transform="rotate(120)">
      <path d="M0,0 C-7,-5 -9,-17 0,-23 C9,-17 7,-5 0,0 Z" fill="#00C2A8"/>
    </g>
    <g transform="rotate(240)">
      <path d="M0,0 C-7,-5 -9,-17 0,-23 C9,-17 7,-5 0,0 Z" fill="#00C2A8"/>
    </g>

    <!-- play mark in the top petal -->
    <path d="M-2.2,-17.2 L5.2,-12.6 L-2.2,-8.2 Z" fill="#16233F"/>

    <!-- hub node -->
    <circle cx="0" cy="0" r="5" fill="#FFB238"/>
  </g>

</svg>
